{% extends "base.html" %}

{% block title %}PredictMedix - Sign Up{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-header">
    <h2>Create Account</h2>
    <p>Sign up to start estimating medical expenses</p>
  </div>

  <div class="glass-card">
    <form action="{{ url_for('signup') }}" method="POST" class="signup-form">
      
      <!-- Full Name Field -->
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <div style="position: relative;">
          <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required style="padding-left: 2.5rem;">
          <i class="fa-regular fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <!-- Email Address Field -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div style="position: relative;">
          <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required style="padding-left: 2.5rem;">
          <i class="fa-regular fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <!-- Mobile Number Field -->
      <div class="form-group">
        <label for="mobile" class="form-label">Mobile Number (India)</label>
        <div style="position: relative;">
          <input type="tel" id="mobile" name="mobile" class="form-control" placeholder="9876543210" pattern="^[6-9]\d{9}$" required style="padding-left: 2.5rem;" title="10-digit Indian mobile number starting with 6-9">
          <i class="fa-solid fa-mobile-screen-button" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
        <small style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; display: block;">Must be a 10-digit number starting with 6, 7, 8, or 9.</small>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required style="padding-left: 2.5rem; padding-right: 2.5rem;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
          <button type="button" id="toggle-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <div style="position: relative;">
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required style="padding-left: 2.5rem; padding-right: 2.5rem;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
          <button type="button" id="toggle-confirm-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; font-size: 1rem; padding: 0.85rem;">
        Sign Up <i class="fa-solid fa-user-plus"></i>
      </button>

    </form>
  </div>

  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
  </div>
</div>
{% endblock %}
