{% extends "base.html" %}

{% block title %}PredictMedix - Forgot Password{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-header">
    <h2>Recover Password</h2>
    <p>Enter your registered email address to receive a recovery reset link</p>
  </div>

  <div class="glass-card">
    <form action="{{ url_for('forgot_password') }}" method="POST">
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div style="position: relative;">
          <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required style="padding-left: 2.5rem;">
          <i class="fa-regular fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; font-size: 1rem; padding: 0.85rem;">
        Send Recovery Link <i class="fa-regular fa-paper-plane"></i>
      </button>

    </form>
  </div>

  <div class="auth-footer">
    Remember your password? <a href="{{ url_for('login') }}">Sign In</a>
  </div>
</div>
{% endblock %}
