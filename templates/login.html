{% extends "base.html" %}

{% block title %}PredictMedix - Login{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-header">
    <h2>Welcome Back</h2>
    <p>Sign in to access the PredictMedix charges estimator</p>
  </div>

  <div class="glass-card">
    <form action="{{ url_for('login') }}" method="POST">
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div style="position: relative;">
          <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required style="padding-left: 2.5rem;">
          <i class="fa-regular fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="{{ url_for('forgot_password') }}" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 550;">Forgot password?</a>
        </div>
        
        <div style="position: relative;">
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required style="padding-left: 2.5rem; padding-right: 2.5rem;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
          <button type="button" id="toggle-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Remember Me Checkbox -->
      <div class="form-group">
        <div class="form-check">
          <input type="checkbox" id="remember" name="remember" class="form-check-input">
          <label for="remember" class="form-label" style="display: inline; margin-bottom: 0; cursor: pointer;">Remember me on this device</label>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; font-size: 1rem; padding: 0.85rem;">
        Sign In <i class="fa-solid fa-right-to-bracket"></i>
      </button>

    </form>
  </div>

  <div class="auth-footer">
    Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a>
  </div>
</div>
{% endblock %}
